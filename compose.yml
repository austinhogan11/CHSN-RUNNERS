services:
  api:
    build:
      context: ./apps/api
    environment:
      APP_VERSION: 0.1.0
      ENVIRONMENT: local
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s

  web:
    build:
      context: ./apps/web
    ports:
      - "8080:8080"
    depends_on:
      - api