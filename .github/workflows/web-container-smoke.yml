name: Web Container Smoke Test

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/web-container-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build API image
        run: docker build -t chsn-runner-api:ci apps/api

      - name: Build Web image
        run: docker build -t chsn-runner-web:ci apps/web

      - name: Create network
        run: docker network create chsn-runner

      - name: Start API container
        run: |
          docker run --rm -d \
            --name api \
            --network chsn-runner \
            -e APP_VERSION=0.1.0 \
            -e ENVIRONMENT=ci \
            chsn-runner-api:ci

      - name: Start Web container
        run: |
          docker run --rm -d \
            --name web \
            --network chsn-runner \
            -p 8080:8080 \
            chsn-runner-web:ci

      - name: Wait for application
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/api/ready > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          echo "Application did not become ready"
          docker logs api
          docker logs web
          exit 1

      - name: Verify frontend
        run: curl --fail http://127.0.0.1:8080/

      - name: Verify API routing
        run: |
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/api/ready

          response=$(curl --fail --silent http://127.0.0.1:8080/api/version)

          echo "$response"

          echo "$response" | grep '"version":"0.1.0"'
          echo "$response" | grep '"environment":"ci"'