name: Deploy Web              

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/web-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Runner Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::537690166345:role/chsn-runners-github-actions
          aws-region: us-east-1

      - name: Deploy hashed assets
        run: |
          aws s3 sync dist/assets/ \
            s3://chsn-runners-web-f731731deabd996e4c8daaa38f/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy application files
        run: |
          aws s3 sync dist/ \
            s3://chsn-runners-web-f731731deabd996e4c8daaa38f/ \
            --exclude "assets/*" \
            --delete \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2320S6PC3W9AE \
            --paths "/*"