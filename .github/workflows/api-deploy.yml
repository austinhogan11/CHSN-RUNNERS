name: API Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: api-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: chsn-runners-api
  LAMBDA_FUNCTION_NAME: chsn-runners-api
  CLOUDFRONT_DOMAIN: d12y9ujcqecxmk.cloudfront.net

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::537690166345:role/chsn-runners-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set image URI
        id: image
        shell: bash
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:deploy-${GITHUB_SHA}"

          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lambda image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.lambda
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.uri }}

      - name: Deploy Lambda image
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "${{ steps.image.outputs.uri }}" \
            --region "$AWS_REGION"

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Smoke test API
        shell: bash
        run: |
            set -euo pipefail

            HEALTH="$(
            curl \
                --fail \
                --silent \
                --show-error \
                --retry 5 \
                --retry-delay 3 \
                "https://${CLOUDFRONT_DOMAIN}/api/health"
            )"

            VERSION="$(
            curl \
                --fail \
                --silent \
                --show-error \
                --retry 5 \
                --retry-delay 3 \
                "https://${CLOUDFRONT_DOMAIN}/api/version"
            )"

            test "$(echo "$HEALTH" | jq -r '.status')" = "ok"
            test "$(echo "$VERSION" | jq -r '.environment')" = "production"
            test -n "$(echo "$VERSION" | jq -r '.version')"