name: API Container Smoke Test

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-container-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build API image
        run: docker build -t chsn-runner-api:ci apps/api

      - name: Start API container
        run: |
          docker run --rm -d \
            --name chsn-runner-api \
            -p 8000:8000 \
            -e APP_VERSION=0.1.0 \
            -e ENVIRONMENT=ci \
            chsn-runner-api:ci

      - name: Wait for API readiness
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          echo "API did not become ready"
          docker logs chsn-runner-api
          exit 1

      - name: Verify health endpoint
        run: |
          curl --fail \
            http://127.0.0.1:8000/health

      - name: Verify readiness endpoint
        run: |
          curl --fail \
            http://127.0.0.1:8000/ready

      - name: Verify version endpoint
        run: |
          response=$(curl --fail --silent http://127.0.0.1:8000/version)

          echo "$response"

          echo "$response" | grep '"version":"0.1.0"'
          echo "$response" | grep '"environment":"ci"'